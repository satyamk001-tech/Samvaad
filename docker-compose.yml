version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: samvaad-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samvaaddb}
      POSTGRES_USER: ${POSTGRES_USER:-samvaad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samvaad_secret_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samvaad} -d ${POSTGRES_DB:-samvaaddb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: samvaad-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: samvaad-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: samvaad-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  coturn:
    image: coturn/coturn:latest
    container_name: samvaad-coturn
    restart: always
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    environment:
      - TURN_PORT=3478
      - REALM=samvaad.local
      - LISTEN_ON_IP=0.0.0.0

volumes:
  postgres_data:
  redis_data:
